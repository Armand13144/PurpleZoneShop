name: PurpleZoneShop
version: 3.0.0
main: com.purplezone.shop.ShopPlugin
api-version: 1.20
authors: [PurpleZone]
description: Custom Shop + Economy for PurpleZone server
softdepend: [PlaceholderAPI, Citizens]

commands:
  shop:
    description: Open the main shop
    usage: /shop
    permission: purplezone.shop
  balance:
    description: Check your balance
    aliases: [bal, money]
    usage: /balance
    permission: purplezone.shop
  givemoney:
    description: Give money to a player
    usage: /givemoney <player> <amount>
    permission: purplezone.shop.admin
  setmoney:
    description: Set a player's balance
    usage: /setmoney <player> <amount>
    permission: purplezone.shop.admin
  takemoney:
    description: Take money from a player
    usage: /takemoney <player> <amount>
    permission: purplezone.shop.admin
  topmoney:
    description: Show richest players
    aliases: [balancetop, moneytop]
    usage: /topmoney
    permission: purplezone.shop
  pay:
    description: Send money to another player
    usage: /pay <player> <amount>
    permission: purplezone.shop

permissions:
  purplezone.shop:
    description: Access the shop
    default: true
  purplezone.shop.admin:
    description: Admin shop commands
    default: op
